[project]
name = "kronostrading"
version = "0.1.0"
description = "Swing-trading signal system for ETFs/ETCs and slow stocks, using Kronos forecasts. Manual execution only."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pyarrow>=16",
    "pydantic>=2.7,<3",
    "pydantic-settings>=2.3,<3",
    "pyyaml>=6.0",
    "structlog>=24.1",
    "typer>=0.12",
    "httpx>=0.27",
    "yfinance>=0.2.40",
    "exchange-calendars>=4.5",
    "matplotlib>=3.8",
    "mplfinance>=0.12.10b0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
# Heavy ML stack, only needed to run Kronos forecasts (not for config, data or backtest logic).
kronos = [
    "torch>=2.2",
    "einops==0.8.1",
    "huggingface_hub==0.33.1",
    "safetensors==0.6.2",
]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
    "types-PyYAML>=6.0",
]

[project.scripts]
kt = "kronostrading.cli:app"

[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kronostrading"]

# CPU-only torch wheels by default (Hetzner VPS). On a rented GPU box, override with
# `uv pip install torch --index-url https://download.pytorch.org/whl/cu124`.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF", "PTH", "DTZ"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["kronostrading"]
exclude = ["third_party/"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["yfinance.*", "exchange_calendars.*", "mplfinance.*", "model.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "network: test needs internet access (data sources, Hugging Face)",
    "kronos: test needs torch and Kronos weights",
]
